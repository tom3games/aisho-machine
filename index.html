<style>
[hidden]{display:none!important}
:root{--enamel:#e6dbc0;--ink:#2b2219;--amber:#ffb02e;--red:#a3301f;--brass:#b8913f;--dot:"DotGothic16",ui-monospace,monospace;--plate:"Zen Antique","Hiragino Mincho ProN",serif;--hand:"Yomogi","Hiragino Maru Gothic ProN",sans-serif;--sans:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#1f2a26}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--sans);color:#f1e6cc;overflow:hidden;height:100svh;
 background:
  radial-gradient(ellipse 60% 38% at 50% 0%,rgba(255,196,110,.30),transparent 70%),
  linear-gradient(transparent 84%,#2a1f17 84%,#1b140f 100%),
  repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 34px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 34px),
  #3b5249}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input{font:inherit;-webkit-user-select:text;user-select:text}
#bulb{position:fixed;left:50%;top:0;width:2px;height:22px;background:#111;transform:translateX(-50%);z-index:1}
#bulb::after{content:"";position:absolute;left:-7px;top:20px;width:16px;height:20px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 40%,#fff6d8,#ffc46e 60%,#c57a2a);box-shadow:0 0 26px 8px rgba(255,190,100,.45)}

/* ロード画面: 真空管があたたまる */
#loading{position:fixed;inset:0;z-index:90;background:#141a17;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .35s}
#loading svg{width:70px;height:120px}
#loading p{font-family:var(--dot);font-size:16px;color:var(--amber);letter-spacing:.12em}
#loadBar{width:150px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#loadBar i{display:block;height:100%;width:0;background:var(--amber);transition:width .2s}
#fil{animation:fil 1.3s ease-in-out infinite alternate}
@keyframes fil{0%{opacity:.35}100%{opacity:1}}

#corner{position:fixed;top:max(6px,env(safe-area-inset-top));right:6px;z-index:60;display:flex;gap:6px}
#corner button{min-width:40px;height:40px;border-radius:20px;background:rgba(15,20,18,.6);color:#f1e6cc;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 10px}
#corner svg{width:20px;height:20px;fill:#f1e6cc}

/* 機械の舞台。タイトルでは上半分、遊びでは全面 */
#stage{position:fixed;left:0;right:0;top:calc(44px + env(safe-area-inset-top));bottom:calc(40svh);z-index:5;transition:bottom .5s ease}
body.play #stage{bottom:calc(8px + env(safe-area-inset-bottom))}
body.end #stage{opacity:0;pointer-events:none}
#mSvg{display:block;width:100%;height:100%;touch-action:none;overflow:visible}
.hit{fill:transparent;cursor:pointer}
body:not(.play) .hit{pointer-events:none}
#tick{font-family:var(--dot);font-size:14px;fill:var(--amber);letter-spacing:.06em}
#plateT{font-family:var(--plate);font-size:21px;fill:#f3e7c9;letter-spacing:.08em}
#tapeT{font-family:var(--hand);font-size:13px;fill:#2b2219}
.dial{font-family:var(--dot);font-size:11px;fill:#3a2d22}
.lamp{fill:#3c2f22;stroke:#1a130d;stroke-width:1}
.lamp.on{fill:#ffcf5a}
#mach.dim .lamp.on{fill:#7a5f2a}
#mach.dim #tick{opacity:.35}
.glowPart{animation:gp .5s ease-in-out infinite alternate}
@keyframes gp{from{opacity:.25}to{opacity:.95}}

/* タイトルの名前札（ダイモテープ） */
#tPanel{position:fixed;left:0;right:0;bottom:0;height:40svh;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px 16px calc(14px + env(safe-area-inset-bottom))}
body.play #tPanel,body.end #tPanel{display:none}
#tTitle{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#tLab{font-family:var(--hand);font-size:17px;color:#ffcf5a;transform:rotate(-2deg);margin-bottom:-4px}
.names{display:flex;align-items:center;gap:8px;width:min(100%,380px)}
.names input{flex:1;min-width:0;height:46px;border:0;border-radius:3px;padding:0 10px;background:#b3261e;color:#fff;font-weight:800;font-size:17px;letter-spacing:.08em;text-align:center;text-shadow:0 -1px 0 rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.25);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.25),0 3px 6px rgba(0,0,0,.35);outline:none}
.names input:nth-of-type(2){background:#1d4f8f}
.names input::placeholder{color:rgba(255,255,255,.88)}
.names input:focus{box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 0 0 3px #ffcf5a}
.names b{font-family:var(--plate);font-size:22px;color:var(--brass);flex:none}
#nameMsg{font-size:13px;color:#ffcf5a;min-height:18px}
#bStart{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 22px 0 16px;border-radius:8px;background:linear-gradient(#4b4a46,#2d2c29);border:1px solid #6b6962;box-shadow:0 5px 0 #151412,0 10px 20px rgba(0,0,0,.4);font-weight:800;font-size:18px;color:#f3e7c9}
#bStart:active{transform:translateY(3px);box-shadow:0 2px 0 #151412}
#bStart i{display:block;width:8px;height:34px;border-radius:4px;background:#0c0b0a;box-shadow:inset 0 0 0 2px #7a776e}
.tLinks{display:flex;gap:16px}
.tLinks button{min-height:42px;padding:0 10px;font-size:15px;color:#e8dcc0;font-family:var(--hand)}

/* 遊びの指ガイド */
#tut{position:fixed;z-index:20;pointer-events:none;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-10%)}
#tut svg{width:46px;height:46px;animation:tap .8s ease-in-out infinite}
#tut.swipe svg{animation:swipe .7s ease-in-out infinite alternate}
#tut.pull svg{animation:pull .9s ease-in infinite}
#tut span{margin-top:2px;background:#ffcf5a;color:#2b2219;font-family:var(--hand);font-size:16px;padding:1px 9px;border-radius:3px;white-space:nowrap;transform:rotate(-3deg);box-shadow:0 2px 4px rgba(0,0,0,.4)}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(8px) scale(.94)}}
@keyframes swipe{from{transform:translateX(-26px) rotate(-10deg)}to{transform:translateX(26px) rotate(10deg)}}
@keyframes pull{0%{transform:translateY(-10px)}80%{transform:translateY(22px)}100%{transform:translateY(22px);opacity:0}}
#fanCur{position:fixed;z-index:19;width:70px;height:90px;pointer-events:none;transform:translate(-50%,-30%);transform-origin:50% 90%}

/* 結果: 感熱紙のレシート */
#vEnd{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(48px + env(safe-area-inset-top)) 16px calc(10px + env(safe-area-inset-bottom))}
#rcBox{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-start}
#rc{display:block;max-width:100%;max-height:100%;width:auto;height:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));animation:rcIn .9s cubic-bezier(.2,.8,.3,1) both}
@keyframes rcIn{from{transform:translateY(-40px) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.endBtns{display:flex;flex-direction:column;gap:6px;width:min(100%,380px);flex:none}
.endBtns .row{display:flex;gap:6px}
.endBtns button{flex:1;min-height:44px;border-radius:6px;font-size:15px;font-weight:700;background:rgba(15,20,18,.6);border:1px solid rgba(241,230,204,.35)}
#bAgain{background:#e6dbc0;color:#2b2219;border:0;box-shadow:0 4px 0 #8c7f62}
#affBox{display:flex;flex-direction:column;align-items:center;gap:3px;width:min(100%,380px);flex:none}
#bAff{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;max-width:100%;padding:0 14px;border-radius:6px;border:1px solid rgba(241,230,204,.4);color:#f1e6cc;font-size:14px;font-weight:700;text-decoration:none;line-height:1.25}
#bAff .pr{flex:none;font-size:13px;font-weight:700;border:1.5px solid #f1e6cc;border-radius:3px;padding:0 5px;line-height:1.45}
#affNote{font-size:11px;color:#c9bd9f}
#tmSupport{margin-top:0!important}

/* 遊び方: 取扱説明書 */
#how{position:fixed;inset:0;z-index:70;background:rgba(10,12,11,.72);display:flex;align-items:center;justify-content:center;padding:16px}
#howCard{width:min(100%,400px);max-height:100%;overflow:hidden;background:#f2ead6;color:#2b2219;border-radius:2px;padding:18px 18px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);transform:rotate(-.8deg);display:flex;flex-direction:column;gap:9px}
#howCard h2{font-family:var(--plate);font-weight:400;font-size:20px;border-bottom:2px solid #2b2219;padding-bottom:4px}
#howBody p{font-size:14px;line-height:1.6;margin-bottom:7px}
#howBody b{background:linear-gradient(transparent 60%,#ffd77a 60%)}
#howBody small{display:block;font-size:10.5px;line-height:1.45;color:#6a5d4b}
#howBody a{color:#1d4f8f}
#howClose{align-self:center;min-height:44px;min-width:140px;border-radius:6px;background:#2b2219;color:#f2ead6;font-weight:700}
@media (max-height:700px){#tLab{font-size:15px}.names input{height:42px}#bStart{min-height:52px}#howBody p{font-size:13px;line-height:1.5;margin-bottom:5px}#tPanel{gap:8px}}
</style>
</head>

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a,input')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  // 読み込み中を失敗と出さない: JS が動いたか（__jsUp）で見る
  setTimeout(function(){
    if(window.__jsUp) return;
    var l=document.getElementById('loading');if(l)l.style.display='none';
    var d=document.createElement('div');d.style.cssText='position:fixed;inset:auto 8px 8px 8px;z-index:199;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },15000);
})();
</script>
